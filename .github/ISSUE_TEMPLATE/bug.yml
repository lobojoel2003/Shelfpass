name: Bug report
description: Something in the app doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected and what you saw. Please leave out real names and ID numbers.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown at the bottom of the sidebar, e.g. "v1.0.0 · build 12 · abc1234".
  - type: dropdown
    id: deploy
    attributes:
      label: How do you run Shelfpass?
      options: [Docker image, docker compose, From source, Not sure]
