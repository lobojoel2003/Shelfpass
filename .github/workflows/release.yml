name: Release

# Publishes a release when a version tag (v1.2.3) is pushed:
#   1. checks the tag matches shelfpass.__version__ and CHANGELOG.md
#   2. runs the full CI pipeline
#   3. builds the Python package and the open-dataset bundle
#   4. builds and pushes a multi-arch container image to GHCR
#   5. creates the GitHub Release with notes from CHANGELOG.md and checksums
#
# It can also be started by hand (Actions → Release → Run workflow): give a
# tag such as v1.0.0. If the tag doesn't exist yet it is created, annotated,
# on the commit the workflow runs from; an existing tag is re-published.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, e.g. v1.0.0 (created from the selected branch if missing)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  tag:
    name: Ensure tag exists
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create the tag for manual runs
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null; then
            echo "Tag ${TAG} already exists; re-publishing it."
            exit 0
          fi
          python3 scripts/check_version.py "$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Shelfpass ${TAG}" "$GITHUB_SHA"
          git push origin "refs/tags/${TAG}"
          echo "Created tag \`${TAG}\` on \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify version
    needs: tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - id: v
        run: |
          python3 scripts/check_version.py "$TAG"
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write

  artifacts:
    name: Build release artifacts
    needs: [verify, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Python sdist and wheel
        run: uv build --out-dir dist
      - name: Open dataset bundle
        run: |
          uv sync --locked --no-dev
          SHELFPASS_ALLOW_INSECURE_KEY=1 uv run python manage.py sync_dataset --check
          uv run python scripts/build_dataset_bundle.py --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist/

  image:
    name: Publish container image
    needs: [verify, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.meta.outputs.image }}
      build: ${{ steps.meta.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Build metadata
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - id: tags
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.meta.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }},enable=${{ !startsWith(env.TAG, 'v0.') }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease == 'false' }}
            type=raw,value=build-${{ steps.meta.outputs.build }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            BUILD_NUMBER=${{ steps.meta.outputs.build }}
            GIT_SHA=${{ steps.meta.outputs.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    name: Create GitHub release
    needs: [verify, artifacts, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS.txt
      - name: Release notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          IMAGE: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
          BUILD: ${{ needs.image.outputs.build }}
        run: |
          {
            python3 scripts/changelog_section.py "$VERSION"
            echo
            echo "---"
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "docker pull ${IMAGE}:${VERSION}"
            echo '```'
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${VERSION}\` |"
            echo "| Build number | \`${BUILD}\` |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Image digest | \`${DIGEST}\` |"
            echo
            echo "Assets: Python wheel and sdist, the open dataset bundle (CC BY-SA 4.0) and \`SHA256SUMS.txt\`."
          } > notes.md
          cat notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          flags=(--title "Shelfpass ${TAG}" --notes-file notes.md --verify-tag)
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* "${flags[@]}"
          fi
