{% if page.has_other_pages %}
<nav class="pagination" aria-label="Pages">
  {% if page.has_previous %}<a class="btn btn-sm" href="{% querystring page=page.previous_page_number %}">← Newer</a>{% endif %}
  <span class="muted small">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn btn-sm" href="{% querystring page=page.next_page_number %}">Older →</a>{% endif %}
</nav>
{% endif %}
