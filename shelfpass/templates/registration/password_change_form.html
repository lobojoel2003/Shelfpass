{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Change your password</h1></div></div>
<div class="card" style="max-width:520px"><div class="card-body">
  <form method="post" class="stack">{% csrf_token %}
    {% for field in form %}{% include "includes/field.html" %}{% endfor %}
    <button class="btn btn-primary" type="submit">Save password</button>
  </form>
</div></div>
{% endblock %}
